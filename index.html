function updateNavigationPosition(point,accuracy){if(!navigating||!navRoute)return;navLastPositionAt=Date.now();setGpsWeak(accuracy>150);if(navVehicleMarker)navVehicleMarker.setPosition(point);else{navVehicleMarker=new AMap.Marker({position:point,content:'<div class="route-progress-dot"></div>',offset:new AMap.Pixel(-10,-10),zIndex:90,title:'车辆当前位置'});amapMap.add(navVehicleMarker)}amapMap.setCenter(point);if(amapMap.getZoom()<16)amapMap.setZoom(16);var nearest=nearestRoutePoint(point);if(!nearest)return;updatePassedRoute(nearest.index,point);var currentStep=stepAtPoint(nearest.index),step=navRoute.steps[currentStep],currentCumulative=navRoute.points[nearest.index].cumulative,stepEndCumulative=navRoute.points[step.endIndex].cumulative,distanceToTurn=Math.max(0,stepEndCumulative-currentCumulative)+Math.min(nearest.distance,50);if(distanceToTurn<22&&currentStep<navRoute.steps.length-1){currentStep++;step=navRoute.steps[currentStep];stepEndCumulative=navRoute.points[step.endIndex].cumulative;distanceToTurn=Math.max(0,stepEndCumulative-currentCumulative)+Math.min(nearest.distance,50)}navStepIndex=currentStep;var remainingGeometry=Math.max(0,navRoute.totalGeometry-navRoute.points[nearest.index].cumulative)+Math.min(nearest.distance,100),remaining=navRoute.distance*(remainingGeometry/navRoute.totalGeometry),remainingSeconds=navRoute.time*(remaining/Math.max(1,navRoute.distance));remainingDistance.textContent=formatNavDistance(remaining);remainingTime.textContent=formatNavTime(remainingSeconds);var action=routeAction(step.raw),nextStep=navRoute.steps[currentStep+1],road=routeRoad(step.raw,nextStep&&nextStep.raw);guidanceLabel.textContent='下一步';guidanceMain.textContent=distanceToTurn<=50?'现在 '+action:'前方 '+formatNavDistance(distanceToTurn)+' '+action;guidanceRoad.textContent=road?'进入：'+road:(step.raw.instruction||'沿当前道路继续行驶');maybeAnnounceTurn(currentStep,distanceToTurn,action,road);var destinationDistance=metersBetween(point,navDestinationPoint);if(destinationDistance<=35){ function requestNavigationWakeLock(){try{if(navigator.wakeLock&&navigator.wakeLock.request)navigator.wakeLock.request('screen').then(function(lock){navWakeLock=lock}).catch(function(){})}catch(e){}}
function startNavigation(){if(!navRoute||navigating)return;navigating=true;document.getElementById('navigationPanel').classList.add('navigating');endNav.classList.add('show');navLastPositionAt=Date.now();navDeviationCount=0;navAnnouncements={};requestNavigationWakeLock();speak('开始导航');if(navWatchId!==null&&navigator.geolocation)navigator.geolocation.clearWatch(navWatchId);if(!navigator.geolocation){setGpsWeak(true);return}navWatchId=navigator.geolocation.watchPosition(function(position){convertGpsPosition(position.coords.longitude,position.coords.latitude).then(function(point){updateNavigationPosition(point,position.coords.accuracy||0)},function(){setGpsWeak(true)})},function(){setGpsWeak(true)},{enableHighAccuracy:true,timeout:10000,maximumAge:1000});clearInterval(navWeakTimer);navWeakTimer=setInterval(function(){if(navigating&&Date.now()-navLastPositionAt>12000)setGpsWeak(true)},4000)}
function endNavigation(arrived){navigating=false;if(navWatchId!==null&&navigator.geolocation){navigator.geolocation.clearWatch(navWatchId);navWatchId=null}clearInterval(navWeakTimer);navWeakTimer=null;if(navWakeLock){try{navWakeLock.release()}catch(e){}navWakeLock=null}document.getElementById('navigationPanel').classList.remove('navigating');endNav.classList.remove('show');gpsWarning.classList.remove('show');guidanceLabel.textContent=arrived?'已到达':'逐步导航';guidanceMain.textContent=arrived?'已到达目的地':'导航已结束';guidanceRoad.textContent=arrived?lastNavDestination:'可以重新规划路线';if(navVehicleMarker&&amapMap){try{amapMap.remove(navVehicleMarker)}catch(e){}navVehicleMarker=null}}
